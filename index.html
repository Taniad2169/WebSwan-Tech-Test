<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta
    name="robots"
    content="noindex, nofollow, noarchive, nosnippet"
  >

  <meta name="theme-color" content="#3da7f2">

  <title>Private WebSwan Workspace</title>

  <style>
    :root {
      color-scheme: light;
      --blue: #3da7f2;
      --blue-dark: #2679c9;
      --ink: #10283d;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      overflow-x: hidden;
      padding: 24px;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(255, 255, 255, 0.24),
          transparent 28%
        ),
        linear-gradient(
          145deg,
          var(--blue),
          var(--blue-dark)
        );

      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(620px, 100%);
      padding: clamp(28px, 6vw, 52px);

      border: 1px solid rgba(255, 255, 255, 0.38);
      border-radius: 24px;

      background: rgba(255, 255, 255, 0.13);

      box-shadow:
        0 24px 70px rgba(10, 59, 103, 0.25);

      text-align: center;
      backdrop-filter: blur(10px);
    }

    .mark {
      display: grid;
      width: 68px;
      height: 68px;
      margin: 0 auto 22px;
      place-items: center;

      border: 3px solid var(--white);
      border-radius: 50%;

      font-size: 30px;
      font-weight: 900;
    }

    .eyebrow {
      margin: 0 0 12px;

      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      font-size: clamp(2rem, 6vw, 3.35rem);
      line-height: 1.05;
      letter-spacing: -0.035em;
    }

    p {
      max-width: 470px;
      margin: 20px auto 0;

      color: rgba(255, 255, 255, 0.9);

      font-size: 1rem;
      line-height: 1.7;
    }

    .notice {
      margin-top: 28px;
      padding: 14px 16px;

      border-radius: 12px;

      background: var(--white);
      color: var(--ink);

      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main>
    <div class="mark" aria-hidden="true">W</div>

    <p class="eyebrow">The WebSwan</p>

    <h1>Private business workspace</h1>

    <p>
      This internal WebSwan tool is not available through the public
      website. Authorized reports are provided directly during scheduled
      client consultations.
    </p>

    <div class="notice">
      No audit controls, private files, client reports, or sign-in links
      are available on this page.
    </div>
  </main>
</body>
</html>
